name: Prune merged branches

on:
  push:
    branches:
      - master
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches that are safe to prune
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = 'master';

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const mergedPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });

            const keep = new Set([defaultBranch]);
            for (const pr of openPulls) {
              if (pr.head.repo?.full_name === `${owner}/${repo}`) keep.add(pr.head.ref);
            }

            const mergedHeads = new Set(
              mergedPulls
                .filter((pr) => pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`)
                .map((pr) => pr.head.ref),
            );

            // One-time audited leftovers that contain unique historical commits
            // but are superseded by merged work on master.
            const explicitlyStale = new Set([
              'agent/direct-agent-message',
              'fix/repair-icon-binary',
              'pr3',
            ]);

            const deleted = [];
            const retained = [];

            for (const branch of branches) {
              if (keep.has(branch.name)) {
                retained.push(`${branch.name} (protected/open PR)`);
                continue;
              }

              let reason = null;
              if (explicitlyStale.has(branch.name)) {
                reason = 'audited superseded branch';
              } else if (mergedHeads.has(branch.name)) {
                reason = 'merged PR head';
              } else {
                try {
                  const comparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${defaultBranch}...${branch.name}`,
                  });
                  if (comparison.data.ahead_by === 0) reason = '0 commits ahead of master';
                } catch (error) {
                  core.warning(`Could not compare ${branch.name}: ${error.message}`);
                }
              }

              if (!reason) {
                retained.push(`${branch.name} (contains unique commits or status unclear)`);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                deleted.push(`${branch.name} — ${reason}`);
              } catch (error) {
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
                retained.push(`${branch.name} (delete failed)`);
              }
            }

            core.summary
              .addHeading('Branch cleanup')
              .addRaw(`Deleted ${deleted.length} safe branch(es).\n\n`)
              .addCodeBlock(deleted.length ? deleted.join('\n') : 'No safe branches to delete.')
              .addRaw(`\nRetained ${retained.length} branch(es).\n\n`)
              .addCodeBlock(retained.join('\n'))
              .write();

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/context-scopes

jobs:
  test:
    name: Runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check friendly launcher syntax
        run: node --check scripts/chef.mjs
      - name: Check Windows launcher syntax
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw scripts/ensure-windows-launcher.ps1))'
      - name: Run runtime tests
        run: npm test
      - name: Run artifact HTTP acceptance test
        run: node --experimental-strip-types tests/artifact-http.ts
      - name: Run Mission plan HTTP acceptance test
        run: node --experimental-strip-types tests/mission-plan-http.ts
      - name: Run decision HTTP acceptance test
        run: node --experimental-strip-types tests/decision-http.ts
      - name: Run execution console acceptance test
        run: node --experimental-strip-types tests/execution-console.ts
      - name: Run channel rooms UI acceptance test
        run: node --experimental-strip-types tests/channel-rooms-ui.ts
      - name: Run artifact shelf UI acceptance test
        run: node --experimental-strip-types tests/artifact-shelf-ui.ts

  web-build:
    name: Web TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web app
        working-directory: web
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/context-scopes

jobs:
  test:
    name: Runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run runtime tests
        run: npm test
      - name: Run artifact HTTP acceptance test
        run: node --experimental-strip-types tests/artifact-http.ts
      - name: Run Mission plan HTTP acceptance test
        run: node --experimental-strip-types tests/mission-plan-http.ts

  web-build:
    name: Web TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Build web app
        working-directory: web
        run: npm run build
